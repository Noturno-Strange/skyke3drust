[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/protocol",
    "crates/security",
    "crates/identity",
    "crates/scripting",
    "crates/persistence",
    "crates/networking",
    "crates/rendering",
    "crates/world",
    "crates/avatars",
    "crates/ui",
    "crates/client",
    "crates/server",
    "tools/visual-comparator",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Noturno-Strange/skyke3drust"
authors = ["Noturno-Strange"]
publish = false

[workspace.dependencies]
# crates internos
sky-shared = { path = "crates/shared" }
sky-protocol = { path = "crates/protocol" }
sky-security = { path = "crates/security" }
sky-identity = { path = "crates/identity" }
sky-persistence = { path = "crates/persistence" }
sky-networking = { path = "crates/networking" }
sky-rendering = { path = "crates/rendering" }
sky-world = { path = "crates/world" }
sky-ui = { path = "crates/ui" }
sky-avatars = { path = "crates/avatars" }

# externos
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "getrandom", "std"] }
base64 = "0.22"
getrandom = "0.4"
rhai = { version = "1.23", features = ["sync", "no_custom_syntax"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bevy = { version = "0.20", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
